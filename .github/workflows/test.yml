name: Run Tests
on: push

jobs:
  test-ui:
    runs-on: ubuntu-20.04
    steps:
      - name: Get code
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test