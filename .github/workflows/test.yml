name: Deploy Project
on: [push, workflow_dispatch] #this workflow will run on every push to the repository and can also be triggered manually

jobs:
  test-ui:
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        #uses is a keyword that allows you to use an action from the GitHub Actions marketplace or a public repository. In this case, we are using the actions/checkout action to check out the code from the repository.
        uses: actions/checkout@v7 #this step checks out the code from the repository so that it can be used in the workflow
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Install dependencies
        #run is a keyword that allows you to run a command in the shell. In this case, we are using it to install the dependencies for the project.
        run: npm ci #this step installs the dependencies for the project using npm ci, which is a command that installs dependencies from the package-lock.json file and is faster than npm install
      - name: Run tests
        run: npm test
  deploy:
    needs: test-ui #this job will only run if the test-ui job is successful
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v7
      - name: Install NodeJs
        uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Build project
        run: npm run build
      - name: Deploy
        run: echo "Deploying..."
